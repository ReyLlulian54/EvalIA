name: Verificación sin inferencia

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Instalar demo y herramientas de prueba
        run: |
          python -m pip install -r requirements.txt -e ".[dev]"
          python -m pip check
      - name: Ejecutar pruebas sin proveedores
        run: python -m pytest -q
      - name: Revisar estilo Python
        run: python -m ruff check .
